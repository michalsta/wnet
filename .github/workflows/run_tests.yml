name: Build

on:
    push:
        branches:
            - ci_test
            - main
        tags:
            - 'v*'

jobs:
  run_pytest:
    name: ${{ matrix.compiler == 'clang' && format('[clang] {0} / py{1}', matrix.os, matrix.python-version) || format('{0} / py{1}', matrix.os, matrix.python-version) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-13 is an intel runner, macos-14 is apple silicon
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-latest, windows-11-arm]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        compiler: [default, clang]
        exclude:
        - os: windows-11-arm
          python-version: "3.10"
        - os: windows-11-arm
          python-version: "3.9"
        # clang only on Linux
        - os: windows-latest
          compiler: clang
        - os: windows-11-arm
          compiler: clang
        - os: macos-latest
          compiler: clang
        - os: macos-15-intel
          compiler: clang


    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
      - name: "Non-default compiler: set up Clang"
        if: matrix.compiler == 'clang'
        run: |
          sudo apt-get install -y clang
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
          echo "CMAKE_ARGS=-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++" >> $GITHUB_ENV
      - name: Install package
        env:
          VERBOSE: '1'
        run: |
          python -m pip install -v .[pytest]
      - name: Test with pytest
        working-directory: ./tests
        run: |
          python -m pytest . -v -m "long or not long"

  sanitize:
    name: "[asan+ubsan] ubuntu-latest / py3.14"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.14
        uses: actions/setup-python@v4
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
      - name: Install package with ASan+UBSan
        run: |
          # address:       heap/stack/global buffer overflows, use-after-free
          # undefined:     all UB (signed overflow, null deref, bad shift, bounds, ...)
          # -fno-sanitize=vptr: skip vtable checks (needs RTTI, causes false positives)
          # -shared-libasan: link libasan as a dynamic .so dependency instead of
          #   embedding it statically. This means libasan is loaded when Python imports
          #   wnet (not at Python startup via LD_PRELOAD), so libstdc++ is already
          #   in memory and ASan can intercept __cxa_throw correctly.
          SAN_FLAGS="-fsanitize=address,undefined -fno-sanitize=vptr -fno-sanitize-recover=all -fno-omit-frame-pointer -Og -g"
          VERBOSE=1 python -m pip install -v .[pytest] \
            --config-settings="cmake.build-type=Debug" \
            --config-settings="cmake.define.CMAKE_CXX_FLAGS=${SAN_FLAGS}"
      - name: Test with pytest (ASan+UBSan)
        working-directory: ./tests
        env:
          # No LD_PRELOAD: libasan.so.8 is a NEEDED entry in wnet_cpp.so.
          # It loads when Python imports wnet, which is after numpy is imported
          # (numpy loads libstdc++.so.6 first, so ASan's __cxa_throw interceptor
          # can find the real function). verify_asan_link_order=0 suppresses the
          # "ASan not first" check since the Python process started without ASan.
          PYTHONMALLOC: malloc
          ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1:print_stacktrace=1:log_path=/tmp/asan:verify_asan_link_order=0"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1:log_path=/tmp/ubsan"
        run: |
          python -m pytest . -v -m "not long" || true
          echo "=== ASan logs ==="
          cat /tmp/asan.* 2>/dev/null || echo "(no asan log files)"
          echo "=== UBSan logs ==="
          cat /tmp/ubsan.* 2>/dev/null || echo "(no ubsan log files)"

