name: Build

on:
    push:
        branches:
            - ci_test
            - testing
            - main
        tags:
            - 'v*'

jobs:
  run_pytest:
    name: ${{ matrix.compiler == 'clang' && format('[clang] {0} / py{1}', matrix.os, matrix.python-version) || format('{0} / py{1}', matrix.os, matrix.python-version) }}
    if: github.ref != 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        os: [linux-amd64, linux-arm64, windows-latest, macos-15-intel, macos-latest, windows-11-arm]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        compiler: [default, clang]
        include:
        - os: linux-amd64
          runner: [self-hosted, wloczykij-amd64]
          container: ubuntu:24.04
        - os: linux-arm64
          runner: [self-hosted, wloczykij-arm64]
          container: ubuntu:24.04
        - os: windows-latest
          runner: windows-latest
        - os: macos-15-intel
          runner: macos-15-intel
        - os: macos-latest
          runner: macos-latest
        - os: windows-11-arm
          runner: windows-11-arm
        exclude:
        - os: windows-11-arm
          python-version: "3.10"
        - os: windows-11-arm
          python-version: "3.9"
        # clang only on Linux
        - os: windows-latest
          compiler: clang
        - os: windows-11-arm
          compiler: clang
        - os: macos-latest
          compiler: clang
        - os: macos-15-intel
          compiler: clang
        # mac: only newest Python
        - os: macos-latest
          python-version: "3.9"
        - os: macos-latest
          python-version: "3.10"
        - os: macos-latest
          python-version: "3.11"
        - os: macos-latest
          python-version: "3.12"
        - os: macos-latest
          python-version: "3.13"
        - os: macos-15-intel
          python-version: "3.9"
        - os: macos-15-intel
          python-version: "3.10"
        - os: macos-15-intel
          python-version: "3.11"
        - os: macos-15-intel
          python-version: "3.12"
        - os: macos-15-intel
          python-version: "3.13"


    steps:
      - name: Install base tools
        if: startsWith(matrix.os, 'linux')
        run: apt-get update -q && apt-get install -y git sudo build-essential
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
      - name: "Non-default compiler: set up Clang"
        if: matrix.compiler == 'clang'
        run: |
          sudo apt-get install -y clang g++
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
          echo "CMAKE_ARGS=-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++" >> $GITHUB_ENV
      - name: Install package
        env:
          VERBOSE: '1'
        run: |
          python -m pip install -v .[pytest]
      - name: Test with pytest
        working-directory: ./tests
        run: |
          python -m pytest . -v -m "long or not long"

  run_pytest_main:
    name: ${{ matrix.compiler == 'clang' && format('[clang] {0} / py{1}', matrix.os, matrix.python-version) || format('{0} / py{1}', matrix.os, matrix.python-version) }}
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        os: [linux-amd64, linux-arm64]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        compiler: [default, clang]
        include:
        - os: linux-amd64
          runner: [self-hosted, wloczykij-amd64]
          container: ubuntu:24.04
        - os: linux-arm64
          runner: [self-hosted, wloczykij-arm64]
          container: ubuntu:24.04

    steps:
      - name: Install base tools
        run: apt-get update -q && apt-get install -y git sudo build-essential
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
      - name: "Non-default compiler: set up Clang"
        if: matrix.compiler == 'clang'
        run: |
          sudo apt-get install -y clang g++
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
          echo "CMAKE_ARGS=-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++" >> $GITHUB_ENV
      - name: Install package
        env:
          VERBOSE: '1'
        run: |
          python -m pip install -v .[pytest]
      - name: Test with pytest
        working-directory: ./tests
        run: |
          python -m pytest . -v -m "long or not long"

  sanitize:
    name: "[sanitize] ${{ matrix.label }}"
    runs-on: [self-hosted, wloczykij-amd64]
    container: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── GCC ──────────────────────────────────────────────────────────
          - label: "gcc asan+ubsan"
            cc: gcc
            cxx: g++
            apt_extra: ""
            build_type: Debug
            # Debug build type activates WNET_DO_ASSERTS + -Og -g in CMakeLists.
            # _GLIBCXX_SANITIZE_VECTOR poisons vector storage for ASan;
            # _GLIBCXX_DEBUG is intentionally omitted here: it conflicts with ASan
            # (different allocator hooks, false positives).
            cxx_flags: >-
              -fsanitize=address,undefined
              -fno-sanitize=vptr
              -fno-sanitize-recover=all
              -fno-omit-frame-pointer
              -D_GLIBCXX_ASSERTIONS
              -D_GLIBCXX_SANITIZE_VECTOR
            link_flags: ""
            # GCC adds libasan.so as DT_NEEDED automatically for .so targets;
            # no LD_PRELOAD needed.
            preload_asan: false
            pythonmalloc: malloc
            asan_opts: "detect_leaks=0:abort_on_error=1:print_stacktrace=1:log_path=/tmp/asan:verify_asan_link_order=0"
            ubsan_opts: "print_stacktrace=1:halt_on_error=1:log_path=/tmp/ubsan"
            dump_logs: true

          - label: "gcc hardened"
            cc: gcc
            cxx: g++
            apt_extra: ""
            # RelWithDebInfo = -O2 -g -DNDEBUG; pass internal macros explicitly
            # since the CMakeLists Debug block does not fire.
            # _GLIBCXX_DEBUG: full iterator-validity checking (safe here: whole .so
            # compiled consistently; no STL objects cross the Python C-API boundary).
            # _FORTIFY_SOURCE=3 requires -O2 (unavailable at -Og used in Debug mode).
            build_type: RelWithDebInfo
            cxx_flags: >-
              -DWNET_DO_ASSERTS
              -DDEBUG_MODE
              -D_GLIBCXX_ASSERTIONS
              -D_GLIBCXX_DEBUG
              -D_FORTIFY_SOURCE=3
              -fstack-protector-strong
              -fstack-clash-protection
              -fcf-protection=full
            link_flags: ""
            preload_asan: false
            pythonmalloc: ""
            asan_opts: ""
            ubsan_opts: ""
            dump_logs: false

          # ── Clang + libstdc++ ─────────────────────────────────────────────
          - label: "clang libstdc++ asan+ubsan"
            cc: clang
            cxx: clang++
            apt_extra: clang libclang-rt-18-dev
            build_type: Debug
            cxx_flags: >-
              -fsanitize=address,undefined
              -fno-sanitize=vptr
              -fno-sanitize-recover=all
              -fno-omit-frame-pointer
              -D_GLIBCXX_ASSERTIONS
              -D_GLIBCXX_SANITIZE_VECTOR
            link_flags: ""
            preload_asan: true
            pythonmalloc: malloc
            asan_opts: "detect_leaks=0:abort_on_error=1:print_stacktrace=1:log_path=/tmp/asan:verify_asan_link_order=0"
            ubsan_opts: "print_stacktrace=1:halt_on_error=1:log_path=/tmp/ubsan"
            dump_logs: true

          - label: "clang libstdc++ hardened"
            cc: clang
            cxx: clang++
            apt_extra: clang
            build_type: RelWithDebInfo
            cxx_flags: >-
              -DWNET_DO_ASSERTS
              -DDEBUG_MODE
              -D_GLIBCXX_ASSERTIONS
              -D_GLIBCXX_DEBUG
              -D_FORTIFY_SOURCE=3
              -fstack-protector-strong
              -fstack-clash-protection
              -fcf-protection=full
            link_flags: ""
            preload_asan: false
            pythonmalloc: ""
            asan_opts: ""
            ubsan_opts: ""
            dump_logs: false

          # ── Clang + libc++ ────────────────────────────────────────────────
          # libc++ 18+ supports _LIBCPP_HARDENING_MODE.
          # _LIBCPP_ENABLE_ASSERTIONS is intentionally absent: since LLVM 18 it is
          # deprecated and hard-errors when combined with _LIBCPP_HARDENING_MODE.
          - label: "clang libc++ asan+ubsan"
            cc: clang-22
            cxx: clang++-22
            apt_extra: clang-22 libclang-rt-22-dev libc++-22-dev libc++abi-22-dev
            # Use LLVM 22 from apt.llvm.org (see use_llvm_apt step). Ubuntu 24.04
            # doesn't ship LLVM 22, so there's no epoch-version conflict.
            use_llvm_apt: true
            build_type: Debug
            cxx_flags: >-
              -fsanitize=address,undefined
              -fno-sanitize=vptr
              -fno-sanitize-recover=all
              -fno-omit-frame-pointer
              -stdlib=libc++
              -D_LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_EXTENSIVE
            # Force dynamic ASan runtime linkage for Python extension modules.
            # Without -shared-libasan the module may import with unresolved
            # __asan_* symbols when no preload is used.
            link_flags: "-stdlib=libc++ -shared-libasan"
            # preload_asan must be false for libc++ builds. LD_PRELOAD injects ASan
            # before libc++abi.so.1 is loaded, so ASan's dlsym(RTLD_NEXT,
            # "__cxa_rethrow_primary_exception") returns NULL and the interceptor
            # CHECK-fails the first time std::rethrow_exception is called. With
            # static ASan (no preload), the extension loads libc++abi.so.1 as a
            # dependency before ASan initializes, so dlsym succeeds.
            preload_asan: false
            pythonmalloc: malloc
            asan_opts: "detect_leaks=0:abort_on_error=1:print_stacktrace=1:log_path=/tmp/asan:verify_asan_link_order=0"
            ubsan_opts: "print_stacktrace=1:halt_on_error=1:log_path=/tmp/ubsan"
            dump_logs: true

          - label: "clang libc++ hardened"
            cc: clang
            cxx: clang++
            apt_extra: clang libc++-dev libc++abi-dev
            build_type: RelWithDebInfo
            cxx_flags: >-
              -stdlib=libc++
              -DWNET_DO_ASSERTS
              -DDEBUG_MODE
              -D_LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_DEBUG
              -D_FORTIFY_SOURCE=3
              -fstack-protector-strong
              -fstack-clash-protection
              -fcf-protection=full
            link_flags: "-stdlib=libc++"
            preload_asan: false
            pythonmalloc: ""
            asan_opts: ""
            ubsan_opts: ""
            dump_logs: false

    steps:
      - name: Install base tools
        run: apt-get update -q && apt-get install -y git sudo build-essential wget
      - uses: actions/checkout@v5
      - name: Set up Python 3.14
        uses: actions/setup-python@v4
        with:
          python-version: "3.14"
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install --upgrade pip
      - name: Set up LLVM 22 from apt.llvm.org
        # Ubuntu 24.04 doesn't ship LLVM 22, so no epoch-version conflict or pinning
        # needed. LLVM project packages lack Ubuntu's -Bsymbolic-functions patch that
        # breaks ASan interception of __cxa_rethrow_primary_exception (LLVM #59432).
        if: matrix.use_llvm_apt
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update -q
      - name: Install system packages
        if: matrix.apt_extra != ''
        run: sudo apt-get install -y ${{ matrix.apt_extra }}
      - name: Set up Clang as compiler
        if: startsWith(matrix.cc, 'clang')
        run: |
          echo "CC=${{ matrix.cc }}" >> $GITHUB_ENV
          echo "CXX=${{ matrix.cxx }}" >> $GITHUB_ENV
          echo "CMAKE_ARGS=-DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}" >> $GITHUB_ENV
      - name: Install package
        env:
          VERBOSE: '1'
          CXX_FLAGS: ${{ matrix.cxx_flags }}
          LINK_FLAGS: ${{ matrix.link_flags }}
        run: |
          if [[ "$LINK_FLAGS" == *"-shared-libasan"* ]]; then
            CLANG_RT_DIR=$(${CC:-clang} -print-runtime-dir 2>/dev/null || true)
            if [ -n "$CLANG_RT_DIR" ] && [ -d "$CLANG_RT_DIR" ]; then
              LINK_FLAGS="$LINK_FLAGS -Wl,-rpath,${CLANG_RT_DIR}"
            fi
          fi
          LINK_ARGS=()
          if [ -n "$LINK_FLAGS" ]; then
            LINK_ARGS=(
              --config-settings="cmake.define.CMAKE_SHARED_LINKER_FLAGS=${LINK_FLAGS}"
              --config-settings="cmake.define.CMAKE_MODULE_LINKER_FLAGS=${LINK_FLAGS}"
            )
          fi
          python -m pip install -v .[pytest] \
            --config-settings="cmake.build-type=${{ matrix.build_type }}" \
            --config-settings="cmake.define.CMAKE_CXX_FLAGS=${CXX_FLAGS}" \
            "${LINK_ARGS[@]}"
      - name: Find sanitizer libraries for LD_PRELOAD
        # Without -shared-libasan, clang links the ASan/UBSan runtime statically
        # into the .so, so no LD_PRELOAD is strictly required.  However, if the
        # clang runtime shared library IS available (libclang-rt-XX-dev installed),
        # preloading it ensures ASan intercepts Python's allocations from startup.
        # We use `clang -print-file-name` to probe for it; if not found we skip
        # preloading and let the static runtime in the extension handle things.
        # IMPORTANT: never preload GCC's libasan here — it brings libstdc++ exception
        # hooks into the process, which crash libc++-compiled extensions when they
        # throw C++ exceptions (ABI mismatch between libstdc++ and libc++ EH tables).
        if: matrix.preload_asan
        run: |
          ASAN_LIB=$(${CC:-clang} -print-file-name=libclang_rt.asan-x86_64.so 2>/dev/null || true)
          if [ ! -f "$ASAN_LIB" ]; then
            # compiler -print-file-name returned a bare name (library not in clang's
            # search path); try the LLVM tree directly.
            ASAN_LIB=$(find /usr/lib/llvm-* -name "libclang_rt.asan-x86_64.so" 2>/dev/null | head -1)
          fi
          if [ -n "$ASAN_LIB" ]; then
            echo "Preloading clang ASan from: $ASAN_LIB"
          else
            echo "clang ASan shared library not found; relying on static runtime embedded in extension"
          fi
          echo "WNET_ASAN_PRELOAD=${ASAN_LIB}" >> $GITHUB_ENV
      - name: Test with pytest
        working-directory: ./tests
        env:
          LD_PRELOAD: ${{ env.WNET_ASAN_PRELOAD }}
          PYTHONMALLOC: ${{ matrix.pythonmalloc }}
          ASAN_OPTIONS: ${{ matrix.asan_opts }}
          UBSAN_OPTIONS: ${{ matrix.ubsan_opts }}
        run: python -m pytest . -v -m "not long"
      - name: Dump sanitizer logs
        if: always() && matrix.dump_logs
        run: |
          echo "=== ASan logs ==="
          cat /tmp/asan.* 2>/dev/null || echo "(no asan log files)"
          echo "=== UBSan logs ==="
          cat /tmp/ubsan.* 2>/dev/null || echo "(no ubsan log files)"
