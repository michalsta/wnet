name: Build

on:
    push:
        branches:
            - ci_test
            - main
        tags:
            - 'v*'

jobs:
  run_pytest:
    name: ${{ matrix.compiler == 'clang' && format('[clang] {0} / py{1}', matrix.os, matrix.python-version) || format('{0} / py{1}', matrix.os, matrix.python-version) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-13 is an intel runner, macos-14 is apple silicon
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-latest, windows-11-arm]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        compiler: [default, clang]
        exclude:
        - os: windows-11-arm
          python-version: "3.10"
        - os: windows-11-arm
          python-version: "3.9"
        # clang only on Linux
        - os: windows-latest
          compiler: clang
        - os: windows-11-arm
          compiler: clang
        - os: macos-latest
          compiler: clang
        - os: macos-15-intel
          compiler: clang


    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
      - name: "Non-default compiler: set up Clang"
        if: matrix.compiler == 'clang'
        run: |
          sudo apt-get install -y clang
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
          echo "CMAKE_ARGS=-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++" >> $GITHUB_ENV
      - name: Install package
        env:
          VERBOSE: '1'
        run: |
          python -m pip install -v .[pytest]
      - name: Test with pytest
        working-directory: ./tests
        run: |
          python -m pytest . -v -m "long or not long"

  sanitize:
    name: "[ubsan] ubuntu-latest / py3.14"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.14
        uses: actions/setup-python@v4
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          sudo apt-get install -y clang
      - name: Install package with UBSan
        env:
          CC: clang
          CXX: clang++
        run: |
          UBSAN_FLAGS="-fsanitize=undefined -fno-sanitize=vptr -fno-omit-frame-pointer -fno-sanitize-recover=all -Og -g"
          VERBOSE=1 python -m pip install -v .[pytest] \
            --config-settings="cmake.build-type=Debug" \
            --config-settings="cmake.define.CMAKE_C_COMPILER=clang" \
            --config-settings="cmake.define.CMAKE_CXX_COMPILER=clang++" \
            --config-settings="cmake.define.CMAKE_CXX_FLAGS=${UBSAN_FLAGS}"
      - name: Test with pytest (UBSan)
        working-directory: ./tests
        run: |
          UBSAN_RT=$(find /usr/lib/llvm-* -name "libclang_rt.ubsan_standalone-$(uname -m).so" 2>/dev/null | head -1)
          echo "UBSan runtime: $UBSAN_RT"
          LD_PRELOAD="$UBSAN_RT" UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1" \
            python -m pytest . -v -m "long or not long"

