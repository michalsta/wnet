[build-system]
# scikit-build-core>=1.0: the [[tool.dynamic-metadata]] table below is the 0.3
# spec, which older backends do not read. They would not fail -- they would
# ignore it, leaving `dynamic = ["dependencies"]` unresolved and shipping a
# wheel that declares no dependencies at all.
requires = ["scikit-build-core>=1.0", "nanobind>=3.0.1", "pylmcf>=1.2.1"]
build-backend = "scikit_build_core.build"

[project]
name = "wnet"
version = "1.3.0"
description = "Tools for calculation of Wasserstein metric between distributions based on Network Flow algorithm"
authors = [{ name="Michał Startek", email="michal.startek@mimuw.edu.pl" }]
maintainers = [{ name="Michał Startek", email="michal.startek@mimuw.edu.pl" }]
# Resolved per-build by _wnet_metadata.py: nanobind-backend is required only
# by a split-mode build, and no PEP 508 marker can see which mode CMake picked
# (in particular none can say "not a free-threaded interpreter").
dynamic = ["dependencies"]
license = "MIT"
license-files = ["LICENCE"]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Development Status :: 5 - Production/Stable",

]
keywords = ["Wasserstein", "Optimal Transport", "Network Flow", "Earth Mover's Distance"]
requires-python = ">=3.10"

[project.urls]
"Homepage" = "https://github.com/michalsta/wnet"
"Repository" = "https://github.com/michalsta/wnet.git"

[project.optional-dependencies]
extras = ["networkx", "matplotlib"]
viz = ["networkx", "pyvis>=0.3", "ipython"]
pytest = ["pytest"]

[tool.scikit-build]
# Split-mode extensions are stable-ABI builds. Declaring the target here gets the
# wheel an `abi3` tag, and nanobind reads it back as SKBUILD_SABI_VERSION to set
# the stable ABI floor, so the two can never drift apart. One wheel per platform
# then covers every Python from 3.10 up. Ignored automatically on PyPy and on
# free-threaded interpreters, which is exactly when CMake falls back to a linked
# build.
wheel.py-api = "cp310"

# A free-threaded interpreter has no classic Stable ABI, so the cp310 request
# above is simply ignored there and the build would fall out as a version-locked
# cp315t wheel. abi3t (PEP 803, 3.15+) is the free-threaded equivalent; ask for
# it explicitly so that lane gets its own portable wheel. Deliberately *not*
# "cp310.cp315t", which would emit a combined cp315-abi3.abi3t tag that a
# GIL-enabled 3.15 would also match, quietly outranking the cp310-abi3 wheel.
[[tool.scikit-build.overrides]]
if.abi-flags = "t"
wheel.py-api = "cp315t"

[tool.scikit-build.sdist]
exclude = [
    "tests/",
    "dist/",
    ".github/",
    ".vscode/",
    ".pytest_cache/",
    "src/wnet/__pycache__/",
    "src/wnet/cpp/wnet/a.out",
    "src/wnet/cpp/wnet/a.out.dSYM/",
    "df.py",
    "example.py",
    "reinstall.sh",
    "reinstall_ubsan.sh",
    ".coverage",
    # Development scaffolding, instructions to the coding assistant, and local
    # editor settings: none of it builds anything or is referenced by
    # CMakeLists.txt. (_wnet_metadata.py stays: the build reads it.)
    "prototypes/",
    "CLAUDE.md",
    ".claude/",
]

[tool.pytest.ini_options]
markers = [
    "long: marks tests as long-running (deselect with '-m \"not long\"')",
]
addopts = "-m 'not long'"

# The standard top-level dynamic-metadata table (0.3 spec). The previous
# [tool.scikit-build.metadata.dependencies] form was deprecated in
# scikit-build-core 1.0 and warns on every build; the two cannot be combined.
# The inline {path, module} value is how a local, in-project provider is named --
# a bare import string here would be looked up in the dynamic_metadata.provider
# entry-point group instead, and not found. _wnet_metadata.py is kept in the
# sdist for exactly this reason.
[[tool.dynamic-metadata]]
provider = { path = ".", module = "_wnet_metadata" }
